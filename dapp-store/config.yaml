﻿# Solana Mobile dApp Store — Publisher / App / Release config
# Schema: https://docs.solanamobile.com/dapp-publishing/intro
#
# Run from project root after `dapp-store init`:
#   npx dapp-store create publisher dapp-store/config.yaml -k <publisher-keypair>
#   npx dapp-store create app dapp-store/config.yaml -k <publisher-keypair>
#   npx dapp-store create release dapp-store/config.yaml -k <publisher-keypair> -b <android-tools-dir>
#   npx dapp-store publish submit dapp-store/config.yaml -k <publisher-keypair>

publisher:
  name: "Cryptonoframe"
  address: "REPLACE_WITH_PUBLISHER_NFT_ADDRESS_AFTER_CREATE"
  website: "https://seekerquest-league.com"
  email: "hello@seekerquest-league.com"
  media:
    - purpose: icon
      uri: ./media/publisher-icon.png

app:
  name: "Seeker Quest League"
  address: "REPLACE_WITH_APP_NFT_ADDRESS_AFTER_CREATE"
  android_package: "com.seekerquest.league"
  urls:
    license_url: "https://seekerquest-league.com/license"
    copyright_url: "https://seekerquest-league.com/terms.html"
    privacy_policy_url: "https://seekerquest-league.com/privacy.html"
    website: "https://seekerquest-league.com"
  media:
    - purpose: icon
      uri: ./media/icon.png

release:
  address: "REPLACE_WITH_RELEASE_NFT_ADDRESS_AFTER_CREATE"
  media:
    - purpose: banner
      uri: ./media/banner-1200x600.png
    - purpose: featureGraphic
      uri: ./media/feature-graphic.png
    - purpose: icon
      uri: ./media/icon.png
    - purpose: screenshot
      uri: ./media/screenshot-1.png
    - purpose: screenshot
      uri: ./media/screenshot-2.png
    - purpose: screenshot
      uri: ./media/screenshot-3.png
    - purpose: screenshot
      uri: ./media/screenshot-4.png
    - purpose: screenshot
      uri: ./media/screenshot-5.png
    - purpose: screenshot
      uri: ./media/screenshot-6.png
  files:
    - purpose: install
      uri: ./media/app-release.apk
  catalog:
    en-US:
      name: "Seeker Quest League"
      # The store truncates this around 28 characters in list view, so the
      # point has to land in the opening words. "Roguelike dungeon crawler"
      # survives the cut as a complete thought; the old line cut to
      # "Tap-to-earn arcade. Earn OR..." — and tap-to-earn is the exact thing
      # the one substantive review complained of being bored by.
      short_description: "Roguelike dungeon crawler. Daily Solana quiz."
      long_description: |
        Seeker Quest League is the first daily-routine arcade game built
        natively for the Solana Mobile Seeker phone.

        🕳 THE ABYSS LABYRINTH — the heart of the game. Descend a dungeon
        that is different every run. Your torch lights only what is near.
        Traps flare before they fire, monsters rear back before they swing,
        and every third floor a Guardian seals the stairs until it falls.
        At each stairwell you choose: go deeper for a bigger multiplier, or
        walk out and bank the run.

        🏕 Seeker's Camp — spend ORB on permanent upgrades. Torch, blade,
        vigor, speed. They survive every death, so a bad run still moves
        you forward.

        🎰 Six more mini-games: Fortune Wheel, Horse Race, Space Runner,
        Treasure Hunt, Arena, PvP, Seeker Lands.

        🟣 Seeker holders get exclusive perks: +5,000 ORB welcome bonus,
        2× ORB rewards forever (Founders), automatic .skr domain as username.

        ⏰ Five minutes a day, or an hour in the dark. Your call.

        Built by Seekers, for Seekers.
      new_in_version: |
        v1.2.6
        ◎ Solana Quest now shows exactly when the next set arrives — a live countdown that is correct in every time zone
        🌐 Invites and Space Runner are now translated into Русский, 中文, 日本語 and Français
        🎨 Cleaner quest screens: the results button no longer sits under the navigation bar, and the home quest card is re-balanced
        🔒 We now record a few anonymous first-session milestones to find where new players get stuck. Details in the updated privacy policy
        🛠 Stability fixes
      saga_features_localized: "Seeker-exclusive bonuses, .skr domain support, daily Solana quiz."
      copyright: "© 2026 Cryptonoframe. All rights reserved."
      sagaFeaturesLocalized: "Exclusive perks for Solana Mobile Seeker holders."
      google_store_package: ""

solana_mobile_dapp_publisher_portal:
  google_store_package: ""
  testing_instructions: |
    1. Connect a Solana wallet via "Profile → Wallet → CONNECT WITH MWA".
    2. Make sure the wallet is on Solana devnet for Pre-Season testing.
    3. Try a free Fortune Wheel spin (uses tickets).
    4. Try a paid 0.01 SOL spin to test the on-chain payment flow.
    5. Check the Genesis News tab to see the live prize pool counter.

    Test devnet airdrop: https://faucet.solana.com
    Test wallet (devnet): any Solana wallet supporting Mobile Wallet Adapter
                          (Phantom, Solflare, Backpack).
